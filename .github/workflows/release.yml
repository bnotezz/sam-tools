name: Build & Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      release_title:
        description: 'Release Title (leave blank for default SAM Tools vX.Y.Z)'
        required: false
        default: ''
      release_notes:
        description: 'Custom release notes (leave blank to auto-generate from commits)'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Auto-increment Version (if requested)
        id: bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$BUMP_TYPE" ] && [ "$BUMP_TYPE" != "none" ]; then
            case "$BUMP_TYPE" in
              patch)
                ./gradlew bumpPatch --no-daemon
                ;;
              minor)
                ./gradlew bumpMinor --no-daemon
                ;;
              major)
                ./gradlew bumpMajor --no-daemon
                ;;
            esac
            
            # Read bumped version
            MAJOR=$(grep '^major=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
            MINOR=$(grep '^minor=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
            PATCH=$(grep '^patch=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            NEW_TAG="v$NEW_VERSION"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add version.properties
            git commit -m "chore(release): bump version to $NEW_TAG [skip ci]"
            git tag "$NEW_TAG"
            git push origin HEAD:${{ github.ref_name }} --tags
            echo "bumped=true" >> $GITHUB_OUTPUT
          else
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: Read Current Version
        id: version_info
        run: |
          MAJOR=$(grep '^major=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          MINOR=$(grep '^minor=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          PATCH=$(grep '^patch=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode Release Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.jks"
          echo "Production keystore successfully decoded."
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY_BASE64 }}

      - name: Build Release APK & Bundle
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}

      - name: Clean Keystore File
        if: always()
        run: rm -f "${{ github.workspace }}/release.jks"

      - name: Prepare Release Artifacts
        run: |
          VERSION="${{ steps.version_info.outputs.version }}"
          mkdir -p release-artifacts
          
          # Locate and rename APK with SemVer
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "release-artifacts/sam-tools-v${VERSION}.apk"
            cp "$APK_PATH" "release-artifacts/sam-tools.apk"
            echo "Copied APK to release-artifacts/sam-tools-v${VERSION}.apk"
          fi
          
          # Locate and rename Bundle with SemVer
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" "release-artifacts/sam-tools-v${VERSION}.aab"
            cp "$AAB_PATH" "release-artifacts/sam-tools.aab"
            echo "Copied AAB to release-artifacts/sam-tools-v${VERSION}.aab"
          fi

      - name: Determine Tag & Title
        id: release_info
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="SAM Tools $TAG"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "prerelease=${{ github.event.inputs.is_prerelease || 'false' }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: ${{ steps.release_info.outputs.notes }}
          generate_release_notes: ${{ steps.release_info.outputs.notes == '' }}
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          files: |
            release-artifacts/sam-tools-v${{ steps.version_info.outputs.version }}.apk
            release-artifacts/sam-tools.apk
            release-artifacts/sam-tools-v${{ steps.version_info.outputs.version }}.aab
            release-artifacts/sam-tools.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
